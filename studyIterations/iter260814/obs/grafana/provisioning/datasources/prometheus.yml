apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    uid: sglang-prom
    editable: true
    jsonData:
      # Must match the tightest scrape_interval in prometheus.yml, or Grafana
      # will pick a coarser $__rate_interval and smooth away the short bursts
      # this dashboard exists to show.
      timeInterval: 1s
      httpMethod: POST
