; Grafana config for the localRun0814_A study run.
; Paths are supplied on the command line by bin/start_obs.sh so this file stays
; machine-independent and checked in.

[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
; Local-only study instance on loopback. Anonymous viewing keeps the dashboard
; one click away instead of behind a login you'd have to reset later.
admin_user = admin
admin_password = admin
disable_gravatar = true

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Admin

[auth]
disable_login_form = false

[users]
default_theme = dark

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[log]
mode = file
level = info

[dashboards]
; Land on the study dashboard instead of the default home page.
default_home_dashboard_path = __HOME_DASHBOARD__
